[package]
name = "flow-gate-station"
version = "0.1.0"
edition = "2021"
description = "流式门谱台 — versioned, replayable flow-cytometry gating station"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
